name: CI

permissions:
  contents: read

on:
  push:
    branches: [master, main]
  pull_request:
  # Weekly, because upstream drift happens while nothing is being pushed —
  # this is what makes the upstream job below an actual early warning.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push supersedes the running check of the same ref; the weekly
# drift run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Check out current Vencord
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vendicated/Vencord
          path: vencord

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install Vencord dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Install exact plugin tree
        run: |
          mkdir -p vencord/src/userplugins/emojiMashup
          git -C plugin archive --format=tar HEAD | tar -C vencord/src/userplugins/emojiMashup -xf -

      - name: Build inside Vencord
        working-directory: vencord
        run: pnpm build

      - name: Typecheck inside Vencord
        working-directory: vencord
        run: pnpm testTsc

      - name: Lint plugin with Vencord
        working-directory: vencord
        run: pnpm exec eslint "src/userplugins/emojiMashup/**/*.{ts,tsx,mts}"

  # The picker tab is a patch against Discord's minified bundle, so it breaks
  # when Discord reships it — silently, and with nothing in this repository
  # changing. This loads Discord's real bundle logged out and asserts all three
  # replacements still land. Nothing signs in and nothing is sent.
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Check out current Vencord
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Vendicated/Vencord
          path: vencord

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vencord/pnpm-lock.yaml

      - name: Install Vencord dependencies
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Install plugin dependencies
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Patch still applies to Discord's live bundle
        working-directory: plugin
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: pnpm verify-patches -- ../vencord

  # External asset drift is a release failure even when no source has changed.
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: External runtime assets still resolve
        run: pnpm verify-assets
